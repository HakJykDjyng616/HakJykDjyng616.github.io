# 站点基础设置
title: 我的博客
description: 这是我的个人博客
url: https://hakjykdjyng616.github.io   # 请将“你的用户名”替换为你的实际GitHub用户名
baseurl: ""                        # 务必保持为空字符串

# 主题设置（使用GitHub Pages默认主题）
theme: jekyll-theme-minimal        # 这是一个轻量、简洁的主题

# 文章固定链接格式（可选，但建议加上）
permalink: /:year/:month/:day/:title/

# 排除不必要的文件（避免干扰）
exclude:
  - README.md
  - .gitignore
